<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">HTML document structure diagram</title>
  <desc id="desc">A diagram showing the basic structure of an HTML document with doctype, html, head, title, and body sections.</desc>

  <rect width="900" height="600" fill="#fffaf0"/>
  <rect x="40" y="40" width="820" height="520" rx="28" fill="#f5f0e6" stroke="#111111" stroke-width="8"/>

  <text x="80" y="105" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#111111">
    HTML DOCUMENT STRUCTURE
  </text>

  <rect x="80" y="145" width="740" height="60" rx="14" fill="#fff36b" stroke="#111111" stroke-width="5"/>
  <text x="110" y="184" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#111111">
    &lt;!DOCTYPE html&gt;
  </text>

  <rect x="80" y="235" width="740" height="270" rx="20" fill="#111111" stroke="#111111" stroke-width="5"/>
  <text x="110" y="285" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#20c4cf">
    &lt;html lang="en"&gt;
  </text>

  <rect x="130" y="320" width="285" height="120" rx="16" fill="#fffaf0" stroke="#20c4cf" stroke-width="5"/>
  <text x="160" y="365" font-family="Courier New, monospace" font-size="25" font-weight="700" fill="#111111">
    &lt;head&gt;
  </text>
  <text x="160" y="402" font-family="Courier New, monospace" font-size="21" fill="#525252">
    &lt;title&gt;...&lt;/title&gt;
  </text>

  <rect x="485" y="320" width="285" height="120" rx="16" fill="#fffaf0" stroke="#fff36b" stroke-width="5"/>
  <text x="515" y="365" font-family="Courier New, monospace" font-size="25" font-weight="700" fill="#111111">
    &lt;body&gt;
  </text>
  <text x="515" y="402" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#525252">
    visible page content
  </text>

  <text x="110" y="478" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#20c4cf">
    &lt;/html&gt;
  </text>
</svg>